name: Lint

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-teleop repo
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-teleop.git ../tpt-teleop
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-teleop repo
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-teleop.git ../tpt-teleop
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo-deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-teleop repo
        run: git clone --depth 1 https://github.com/tpt-solutions/tpt-teleop.git ../tpt-teleop
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
