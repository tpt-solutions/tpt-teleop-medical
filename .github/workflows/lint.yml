name: Lint

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-teleop repo
        run: git init -q ../tpt-teleop && git -C ../tpt-teleop fetch -q --depth 1 https://github.com/tpt-solutions/tpt-teleop.git 3cbf38b30f65d3381f83694ef0e6ac5ac807e9bd && git -C ../tpt-teleop checkout -q FETCH_HEAD && test -f ../tpt-teleop/crates/tpt-t-core/Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-teleop repo
        run: git init -q ../tpt-teleop && git -C ../tpt-teleop fetch -q --depth 1 https://github.com/tpt-solutions/tpt-teleop.git 3cbf38b30f65d3381f83694ef0e6ac5ac807e9bd && git -C ../tpt-teleop checkout -q FETCH_HEAD && test -f ../tpt-teleop/crates/tpt-t-core/Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo-deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sibling tpt-teleop repo
        run: git init -q ../tpt-teleop && git -C ../tpt-teleop fetch -q --depth 1 https://github.com/tpt-solutions/tpt-teleop.git 3cbf38b30f65d3381f83694ef0e6ac5ac807e9bd && git -C ../tpt-teleop checkout -q FETCH_HEAD && test -f ../tpt-teleop/crates/tpt-t-core/Cargo.toml
      # Run cargo-deny on the runner rather than via cargo-deny-action: that action
      # runs in a Docker container that only mounts the workspace, so the sibling
      # tpt-teleop checkout is invisible to it and cargo metadata fails.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
