name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v4

      # tpt-t-medical-teleop depends on tpt-teleop by relative path (../../../tpt-teleop),
      # so the sibling repo must sit next to this checkout.
      - name: Fetch sibling tpt-teleop repo
        run: git init -q ../tpt-teleop && git -C ../tpt-teleop fetch -q --depth 1 https://github.com/tpt-solutions/tpt-teleop.git 3cbf38b30f65d3381f83694ef0e6ac5ac807e9bd && git -C ../tpt-teleop checkout -q FETCH_HEAD && test -f ../tpt-teleop/crates/tpt-t-core/Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

  loom:
    name: Loom model checks (tpt-t-medical-ring)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sibling tpt-teleop repo
        run: git init -q ../tpt-teleop && git -C ../tpt-teleop fetch -q --depth 1 https://github.com/tpt-solutions/tpt-teleop.git 3cbf38b30f65d3381f83694ef0e6ac5ac807e9bd && git -C ../tpt-teleop checkout -q FETCH_HEAD && test -f ../tpt-teleop/crates/tpt-t-core/Cargo.toml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run loom interleaving tests
        run: cargo test -p tpt-t-medical-ring --test loom --release

  miri:
    name: Miri (unsafe code in tpt-t-medical-ring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sibling tpt-teleop repo
        run: git init -q ../tpt-teleop && git -C ../tpt-teleop fetch -q --depth 1 https://github.com/tpt-solutions/tpt-teleop.git 3cbf38b30f65d3381f83694ef0e6ac5ac807e9bd && git -C ../tpt-teleop checkout -q FETCH_HEAD && test -f ../tpt-teleop/crates/tpt-t-core/Cargo.toml

      - name: Install nightly Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@v2

      # The threaded stress test runs 200k items, which is too slow under Miri.
      # Its single-threaded tests still cover the unsafe slot accesses.
      - name: Run ring unit tests under Miri
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p tpt-t-medical-ring --lib -- --skip cross_thread
