[workspace]
resolver = "3"
members = [
    "crates/tpt-t-medical-bridge-hl7fhir",
    "crates/tpt-t-medical-compliance",
    "crates/tpt-t-medical-haptic",
    "crates/tpt-t-medical-logistics",
    "crates/tpt-t-medical-pharmacy",
    "crates/tpt-t-medical-sterilize",
    "crates/tpt-t-medical-core",
    "crates/tpt-t-medical-hipaa",
    "crates/tpt-t-medical-ring",
    "crates/tpt-t-medical-safety",
    "crates/tpt-t-medical-surgical",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
